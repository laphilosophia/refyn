<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refyn PoC - ETL Transform Test</title>
    <style>
      :root {
        --bg: #0a0a0f;
        --surface: #12121a;
        --border: #1f1f2e;
        --text: #e4e4e7;
        --text-dim: #71717a;
        --accent: #6366f1;
        --success: #22c55e;
        --warning: #eab308;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 2rem;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
      }

      h1 {
        font-size: 2rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        background: linear-gradient(135deg, var(--accent), #a855f7);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .subtitle {
        color: var(--text-dim);
        margin-bottom: 2rem;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }

      .card h2 {
        font-size: 1rem;
        font-weight: 500;
        color: var(--text-dim);
        margin-bottom: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 1rem;
      }

      .metric {
        background: rgba(99, 102, 241, 0.1);
        border: 1px solid rgba(99, 102, 241, 0.2);
        border-radius: 8px;
        padding: 1rem;
      }

      .metric-label {
        font-size: 0.75rem;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .metric-value {
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--accent);
        margin-top: 0.25rem;
      }

      .metric-value.success {
        color: var(--success);
      }

      .metric-value.warning {
        color: var(--warning);
      }

      button {
        background: linear-gradient(135deg, var(--accent), #7c3aed);
        color: white;
        border: none;
        padding: 0.75rem 2rem;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .status {
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        border-radius: 6px;
        font-size: 0.875rem;
      }

      .status.running {
        background: rgba(234, 179, 8, 0.1);
        color: var(--warning);
      }

      .status.complete {
        background: rgba(34, 197, 94, 0.1);
        color: var(--success);
      }

      .preview {
        margin-top: 1rem;
        overflow: auto;
        max-height: 300px;
      }

      .preview table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.8rem;
      }

      .preview th,
      .preview td {
        text-align: left;
        padding: 0.5rem;
        border-bottom: 1px solid var(--border);
      }

      .preview th {
        color: var(--text-dim);
        font-weight: 500;
        position: sticky;
        top: 0;
        background: var(--surface);
      }

      .preview td {
        font-family: 'Fira Code', monospace;
      }

      code {
        padding: 0.2rem 0.4rem;
        border-radius: 4px;
        font-size: 0.75rem;
        line-height: 1.25;
        color: rgb(192, 135, 11);
      }

    </style>
  </head>

  <body>
    <div class="container">
      <h1>⚡ Refyn PoC</h1>
      <p class="subtitle">In-Browser ETL Runtime - Transform Performance Test</p>

      <div class="card">
        <h2>Controls</h2>
        <button id="runBtn">Run Transform</button>
        <div id="status" class="status" style="display: none;"></div>
      </div>

      <div class="card">
        <h2>Performance Metrics</h2>
        <div class="metrics">
          <div class="metric">
            <div class="metric-label">Total Time</div>
            <div class="metric-value" id="totalTime">—</div>
          </div>
          <div class="metric">
            <div class="metric-label">Worker Time</div>
            <div class="metric-value" id="workerTime">—</div>
          </div>
          <div class="metric">
            <div class="metric-label">Main Thread Block</div>
            <div class="metric-value" id="mainBlock">—</div>
          </div>
          <div class="metric">
            <div class="metric-label">Rows Processed</div>
            <div class="metric-value" id="rowCount">—</div>
          </div>
          <div class="metric">
            <div class="metric-label">Chunks</div>
            <div class="metric-value" id="chunkCount">—</div>
          </div>
          <div class="metric">
            <div class="metric-label">Memory Delta</div>
            <div class="metric-value" id="memoryDelta">—</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Schema Used</h2>
        <pre><code id="schemaPreview"></code></pre>
      </div>

      <div class="card">
        <h2>Results Preview (first 10 rows)</h2>
        <div class="preview" id="preview">
          <p style="color: var(--text-dim);">Run transform to see results...</p>
        </div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>

</html>
